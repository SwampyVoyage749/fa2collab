; FA2sp 局域网协同编辑（v0.4.0）
; 改完保存，重启地编生效；也可以进图后按 Ctrl+Alt+C 打开设置窗改。
[Collab]
Enabled=1              ; 1 = 启用联机模块
Host=1                 ; 1 = 我开房（监听） / 0 = 我加入别人
HostAddress=127.0.0.1  ; 加入方填房主的局域网 IP；房主填什么都行
Port=31415             ; 两边必须一致
Name=Alpha             ; 显示给对方的名字

; 界面元素
Hud=1                  ; 左上角状态条
PlayerList=1           ; 玩家列表

; 实验功能（默认关；开启前先备份地图）
IniDeleteSync=0        ; 1 = 删除的 INI 键也同步（压测崩过）
