; FA2sp 局域网协同编辑（v0.4.0）
; 改完保存，重启地编生效；也可以进图后按 Ctrl+Alt+C 打开设置窗改。
[Collab]
Enabled=1              ; 1 = 启用联机模块
Host=1                 ; 1 = 我开房（监听） / 0 = 我加入别人
HostAddress=127.0.0.1  ; 加入方填房主的局域网 IP；房主填什么都行
Port=31415             ; 两边必须一致
Name=Alpha             ; 显示给对方的名字

; 界面元素
Hud=1                  ; 左上角状态条
PlayerList=1           ; 玩家列表

; 删除同步（v0.4.1 起默认开）：对方删掉的建筑/触发/键，这边也会删
IniDeleteSync=1        ; 1 = 同步删除；0 = 只增改不删
